# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 시작할 때 없는 표 만들기 — db/init 의 SQL 을 Hibernate 검사(validate)보다 먼저 실행한다.
# 2026-10-20 표 없이 배포돼 서버가 뜨지 않은 일 뒤로 question_notes 는 서버가 스스로 만든다.
# 켜질 때마다 도므로 SQL 은 모두 CREATE TABLE IF NOT EXISTS 처럼 여러 번 돌아도 안전해야 한다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init/question_notes.sql

# Server
server.port=${PORT:8080}
spring.main.headless=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart (이미지 업로드 최대 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB