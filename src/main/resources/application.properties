# Database
spring.datasource.url=jdbc:mariadb://localhost:3306/quiz-maker?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=system

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Server
server.port=8080

# JWT
jwt.secret=quiz-maker-secret-key-please-change-in-production-minimum-32chars
jwt.expiration=86400000